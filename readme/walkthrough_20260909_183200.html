<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>HUD 即時預覽與免插眼鏡除錯功能更新完成記錄</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121212; color: #E0E0E0; padding: 24px; }
        h1 { color: #69F0AE; }
        .card { background: #1E1E1E; border-radius: 8px; padding: 16px; margin-bottom: 16px; border-left: 4px solid #69F0AE; }
        ul { line-height: 1.8; }
        code { background: #2A2A2A; color: #69F0AE; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>HUD 即時預覽與免插眼鏡除錯功能更新完成記錄</h1>
    <div class="card">
        <h3>全新功能亮點</h3>
        <p>1. <b>置頂 HUD 鏡像預覽：</b>無須外接眼鏡，在手機端即可即時觀察抬頭顯示器的動態佈局。</p>
        <p>2. <b>即時數據看板 (Inspector)：</b>條列地圖來源、動作名稱、距離公尺、道路名稱、車道箭頭與號誌秒數。</p>
        <p>3. <b>一鍵快速注入測試：</b>隨手點擊【高德右轉 48m】或【Google 左轉 150m】，立即在手機與眼鏡端呈現效果。</p>
        <p>4. <b>全螢幕 HUD 模擬：</b>直接將手機轉為 HUD 顯示器，方便在車上或室內展示。</p>
    </div>
</body>
</html>
