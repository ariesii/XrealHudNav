<h2>一、三大核心優化項目</h2>
<ol>
  <li><strong>巨型字體與圖標：</strong> 指標區放大 2 倍（136dp 箭頭、56sp 距離），GPS 車速放大 3 倍（96sp 震撼大數字）。</li>

  <li><strong>電池電量圖標與省電模式選擇：</strong> 眼鏡端顯示即時電量 <code>🔋 85%</code>，支援標準/智慧/極限三種模式。</li>
