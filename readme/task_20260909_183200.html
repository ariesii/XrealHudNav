<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>HUD 即時預覽與免插眼鏡除錯看板任務說明</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121212; color: #E0E0E0; padding: 24px; }
        h1 { color: #00E5FF; }
        .card { background: #1E1E1E; border-radius: 8px; padding: 16px; margin-bottom: 16px; border-left: 4px solid #00E5FF; }
        ul { line-height: 1.8; }
        code { background: #2A2A2A; color: #FFD54F; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>HUD 即時預覽與免插眼鏡除錯看板任務說明</h1>
    <div class="card">
        <h3>核心改造項目</h3>
        <ul>
            <li><b>預覽視窗置頂與常態顯示：</b>打開 App 即可看到 HUD 儀表盤，解決未導航時全黑遮蔽問題。</li>
            <li><b>即時接收數據看板 (Inspector)：</b>在手機端直接檢視轉向、距離、路名、車道線與紅綠燈倒數。</li>
            <li><b>全螢幕 HUD 模擬模式：</b>手機橫螢幕滿版模擬 XREAL 眼鏡顯示，免插眼鏡即可 100% 驗證。</li>
            <li><b>一鍵測試注入：</b>提供高德右轉、Google 左轉與紅綠燈快速測試按鈕。</li>
        </ul>
    </div>
</body>
</html>
